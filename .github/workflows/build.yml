# FrameExtractor の Windows exe を GitHub 上でビルドする。
# build.bat は pause / explorer を含むため CI では直接使わず、
# 同じ pip インストールと PyInstaller コマンドをここで実行する。
#
# 使い方：
#   - main に push するとビルドされ、latest リリースに exe が添付される
#   - タグ v* を push するとビルドされ、そのタグの Release に exe が添付される
#     例: git tag v1.1.0 && git push origin v1.1.0
#   - 手動でも実行できる（Actions タブ → Build Windows exe → Run workflow）。
#     その場合は Artifacts から exe をダウンロードする。
name: Build Windows exe

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless pillow customtkinter yt-dlp imageio-ffmpeg tkinterdnd2 curl-cffi pyinstaller

      - name: Build exe
        run: |
          python -m PyInstaller --onefile --windowed --noconfirm --collect-all customtkinter --collect-all yt_dlp --collect-all imageio_ffmpeg --collect-all tkinterdnd2 --collect-all curl_cffi --add-data "browser_extension;browser_extension" --name FrameExtractor --icon app.ico --add-data "app.ico;." frame_extractor.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameExtractor-windows
          path: dist/FrameExtractor.exe
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FrameExtractor.exe

      - name: Attach to rolling Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: dist/FrameExtractor.exe
